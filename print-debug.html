<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug — print.js</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #F7F4EE; color: #1A1A1A; line-height: 1.6; }
        h1 { font-size: 18px; margin: 0 0 16px; }
        .step { padding: 12px; margin-bottom: 12px; border-radius: 6px; font-size: 13px; font-family: monospace; white-space: pre-wrap; word-break: break-word; }
        .info { background: #E0E7FF; color: #1E3A8A; }
        .ok { background: #D1FAE5; color: #065F46; }
        .fail { background: #FEE2E2; color: #991B1B; }
        .warn { background: #FEF3C7; color: #92400E; }
    </style>
</head>
<body>

<h1>Debug — print.js diagnostic</h1>
<div id="out"></div>

<script>
(function () {
    const out = document.getElementById('out');

    function addStep(type, msg) {
        const div = document.createElement('div');
        div.className = 'step ' + type;
        div.textContent = msg;
        out.appendChild(div);
    }

    function test() {
        addStep('info', 'Starting diagnostic...');
        addStep('info', 'URL: ' + window.location.href);
        addStep('info', 'Origin: ' + window.location.origin);

        // Step 1: Check print.js loaded
        addStep('info', '\n[1] Testing print.js load...');
        fetch('/js/print.js')
            .then(r => {
                if (r.ok) {
                    addStep('ok', 'print.js exists → HTTP ' + r.status);
                    return r.text();
                } else {
                    addStep('fail', 'print.js → HTTP ' + r.status);
                    return null;
                }
            })
            .then(text => {
                if (text) {
                    addStep('ok', 'print.js size: ' + text.length + ' chars');
                    if (text.indexOf('fetchBookHtml') !== -1) {
                        addStep('ok', 'print.js contains new fetchBookHtml function ✓');
                    } else {
                        addStep('warn', 'print.js is OLD version (no fetchBookHtml)');
                    }
                }

                // Step 2: Test fetch /book.html
                addStep('info', '\n[2] Testing fetch /book.html...');
                return fetch('/book.html', { cache: 'no-store' });
            })
            .then(r => {
                if (!r.ok) {
                    addStep('fail', '/book.html → HTTP ' + r.status);
                    return null;
                }
                addStep('ok', '/book.html → HTTP ' + r.status);
                return r.text();
            })
            .then(text => {
                if (text) {
                    addStep('ok', '/book.html size: ' + text.length + ' chars');
                    if (text.indexOf('chaptersEn') !== -1) {
                        addStep('ok', '/book.html contains chaptersEn ✓');
                    } else {
                        addStep('fail', '/book.html DOES NOT contain chaptersEn');
                    }
                    if (text.indexOf('chaptersHi') !== -1) {
                        addStep('ok', '/book.html contains chaptersHi ✓');
                    }
                }

                // Step 3: Test DOMParser
                addStep('info', '\n[3] Testing DOMParser...');
                try {
                    const doc = new DOMParser().parseFromString(text || '', 'text/html');
                    const container = doc.querySelector('#chaptersEn');
                    if (container) {
                        const chapters = container.querySelectorAll('article.chapter');
                        addStep('ok', 'Found #chaptersEn with ' + chapters.length + ' chapters');
                    } else {
                        addStep('fail', '#chaptersEn NOT found after parse');
                    }
                } catch (e) {
                    addStep('fail', 'DOMParser error: ' + e.message);
                }

                // Step 4: Test print.html elements
                addStep('info', '\n[4] Checking print.html elements...');
                fetch('/print.html')
                    .then(r => r.text())
                    .then(html => {
                        const checks = [
                            ['id="loading"', 'loading element'],
                            ['id="book-root"', 'book-root element'],
                            ['id="book-content"', 'book-content element'],
                            ['id="toc-list"', 'toc-list element'],
                            ['css/print.css', 'print.css link'],
                            ['js/print.js', 'print.js script']
                        ];
                        checks.forEach(function (c) {
                            if (html.indexOf(c[0]) !== -1) {
                                addStep('ok', '✓ ' + c[1]);
                            } else {
                                addStep('fail', '✗ MISSING: ' + c[1] + ' (' + c[0] + ')');
                            }
                        });
                        addStep('info', '\n[DONE] Diagnostic complete.');
                    })
                    .catch(e => {
                        addStep('fail', 'Could not fetch print.html: ' + e.message);
                    });
            })
            .catch(err => {
                addStep('fail', 'FATAL: ' + err.message);
                addStep('fail', 'Stack: ' + err.stack);
            });
    }

    test();
})();
</script>

</body>
</html>
