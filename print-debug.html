<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug v2 — print.js runtime test</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #F7F4EE; color: #1A1A1A; line-height: 1.6; }
        h1 { font-size: 18px; margin: 0 0 16px; }
        .step { padding: 12px; margin-bottom: 12px; border-radius: 6px; font-size: 13px; font-family: monospace; white-space: pre-wrap; word-break: break-word; }
        .info { background: #E0E7FF; color: #1E3A8A; }
        .ok { background: #D1FAE5; color: #065F46; }
        .fail { background: #FEE2E2; color: #991B1B; }
        .warn { background: #FEF3C7; color: #92400E; }
    </style>
</head>
<body>

<h1>Debug v2 — print.js runtime test</h1>
<div id="out"></div>

<script>
(function () {
    const out = document.getElementById('out');
    function addStep(type, msg) {
        const div = document.createElement('div');
        div.className = 'step ' + type;
        div.textContent = msg;
        out.appendChild(div);
    }

    // Test 1: check URL params
    addStep('info', 'URL: ' + window.location.href);
    
    // Test 2: manually load print.html into DOM
    addStep('info', '\n[1] Fetching print.html into iframe...');
    
    const iframe = document.createElement('iframe');
    iframe.src = '/print.html?lang=en';
    iframe.style.cssText = 'width:100%;height:400px;border:2px solid #8B6F3F;margin-top:12px;background:#fff;';
    iframe.onload = function () {
        addStep('ok', 'iframe loaded');
        
        setTimeout(function () {
            try {
                const doc = iframe.contentDocument;
                const win = iframe.contentWindow;
                
                addStep('info', '\n[2] Checking iframe state...');
                
                // Loading element
                const loading = doc.getElementById('loading');
                if (loading) {
                    addStep('ok', 'loading element found. hidden=' + loading.hidden);
                    addStep('info', 'loading HTML: ' + loading.textContent.substring(0, 200));
                } else {
                    addStep('fail', 'loading element NOT found');
                }
                
                // book-root
                const root = doc.getElementById('book-root');
                if (root) {
                    addStep('ok', 'book-root found. hidden=' + root.hidden);
                } else {
                    addStep('fail', 'book-root NOT found');
                }
                
                // book-content children
                const content = doc.getElementById('book-content');
                if (content) {
                    addStep('ok', 'book-content children: ' + content.children.length);
                }
                
                // toc-list children
                const toc = doc.getElementById('toc-list');
                if (toc) {
                    addStep('ok', 'toc-list children: ' + toc.children.length);
                }
                
                // Check for console errors from iframe
                addStep('info', '\n[3] iframe body text (first 300 chars):');
                addStep('info', doc.body.innerText.substring(0, 300));
                
                // Check if print.js actually executed
                addStep('info', '\n[4] Checking if print.js executed...');
                const scriptTags = doc.querySelectorAll('script');
                addStep('info', 'Script tags in iframe: ' + scriptTags.length);
                scriptTags.forEach(function (s, i) {
                    addStep('info', '  [' + i + '] src=' + (s.src || 'inline'));
                });
                
                addStep('info', '\n[DONE] Check complete.');
                
            } catch (e) {
                addStep('fail', 'Cannot access iframe: ' + e.message);
                addStep('fail', 'Note: cross-origin iframe mein access nahi milega');
            }
        }, 3000);
    };
    iframe.onerror = function () {
        addStep('fail', 'iframe load error');
    };
    
    document.body.appendChild(iframe);
    
})();
</script>

</body>
</html>
