<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get in Touch — Ravi Raj</title>

    <meta name="description" content="Send a message to Ravi Raj — author, developer. For readers, recruiters, or anyone who wants to talk." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#F7F4EE" />
    <link rel="canonical" href="https://ravirajhere.vercel.app/contact.html" />

    <!-- ====== OPEN GRAPH ====== -->
    <meta property="og:title" content="Get in Touch — Ravi Raj" />
    <meta property="og:description" content="Send a message to Ravi Raj." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ravirajhere.vercel.app/contact.html" />

    <link rel="icon" type="image/png" href="assets/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           CONTACT — GET IN TOUCH
           Neutral · Light + gold · Accessible · No dependencies
           ============================================================ */

        /* ---------- RESET ---------- */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        /* ---------- TOKENS ---------- */
        :root {
            --bg: #F7F4EE;
            --bg-soft: #F1ECE3;
            --card: #FFFFFF;
            --text: #1C1A17;
            --text-soft: #4A423C;
            --text-muted: #7A7068;
            --accent: #8B6F3F;
            --accent-dark: #6E5630;
            --border: #E5DED2;
            --border-strong: #D6CCBA;
            --danger: #B91C1C;
            --success: #15803D;

            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, monospace;

            --radius: 8px;
            --radius-sm: 6px;
            --radius-lg: 12px;

            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0F0E0C;
                --bg-soft: #1A1815;
                --card: #1A1815;
                --text: #EDE8E0;
                --text-soft: #B8B0A5;
                --text-muted: #7A7068;
                --accent: #C9A961;
                --accent-dark: #D9BC7A;
                --border: #2A2724;
                --border-strong: #3A3632;
                --danger: #EF4444;
                --success: #4ADE80;
            }
        }

        body {
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 48px 44px;
            box-shadow:
                0 1px 2px rgba(28, 26, 23, 0.04),
                0 12px 32px rgba(28, 26, 23, 0.06);
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 8px;
        }

        .header-text h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .header-text p {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s var(--ease);
            flex-shrink: 0;
            padding: 0;
        }

        .close-btn:hover {
            color: var(--text);
            border-color: var(--text);
            background: var(--bg-soft);
        }

        .close-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 24px 0 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-soft);
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .form-group label .req {
            color: var(--danger);
            margin-left: 2px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            line-height: 1.5;
            outline: none;
            transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 111, 63, 0.12);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 130px;
            font-family: inherit;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--text);
            color: var(--bg);
            border: 1px solid var(--text);
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.2s var(--ease);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .submit-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .submit-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .submit-btn svg {
            flex-shrink: 0;
        }

        .status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            display: none;
            border: 1px solid transparent;
        }

        .status.is-visible {
            display: block;
        }

        .status.is-success {
            background: rgba(21, 128, 61, 0.08);
            border-color: rgba(21, 128, 61, 0.3);
            color: var(--success);
        }

        .status.is-error {
            background: rgba(185, 28, 28, 0.08);
            border-color: rgba(185, 28, 28, 0.3);
            color: var(--danger);
        }

        .status.is-loading {
            background: rgba(139, 111, 63, 0.08);
            border-color: rgba(139, 111, 63, 0.3);
            color: var(--accent);
        }

        .footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .hp-field {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 520px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 32px 24px;
                border-radius: var(--radius);
            }

            .header-text h1 {
                font-size: 22px;
            }

            .header-text p {
                font-size: 14px;
            }

            .close-btn {
                width: 32px;
                height: 32px;
            }

            .submit-btn {
                font-size: 14px;
                padding: 13px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <main class="container" role="main">

        <div class="header">
            <div class="header-text">
                <h1>Get in Touch</h1>
                <p>I'll reply within a few days.</p>
            </div>

            <button type="button" class="close-btn" id="closeBtn" aria-label="Close and go back" title="Close (Esc)">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <form id="contactForm" novalidate>

            <div class="hp-field" aria-hidden="true">
                <label for="hp_website">Website (leave empty)</label>
                <input type="text" id="hp_website" name="website" tabindex="-1" autocomplete="off" />
            </div>

            <div class="form-group">
                <label for="user_name">Your Name <span class="req">*</span></label>
                <input
                    type="text"
                    id="user_name"
                    name="user_name"
                    placeholder="e.g. Priya Sharma"
                    autocomplete="name"
                    required
                    minlength="2"
                    maxlength="60"
                />
            </div>

            <div class="form-group">
                <label for="user_email">Your Email <span class="req">*</span></label>
                <input
                    type="email"
                    id="user_email"
                    name="user_email"
                    placeholder="e.g. priya@example.com"
                    autocomplete="email"
                    required
                    maxlength="120"
                />
            </div>

            <div class="form-group">
                <label for="user_message">Your Message <span class="req">*</span></label>
                <textarea
                    id="user_message"
                    name="user_message"
                    placeholder="Write your message here..."
                    required
                    minlength="10"
                    maxlength="2000"
                    rows="6"
                ></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span>Send Message</span>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <path d="M3 11L11 3M11 3H5M11 3V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <div id="formStatus" class="status" role="status" aria-live="polite"></div>
        </form>

        <footer class="footer">
            © <span id="year">2026</span> Ravi Raj
        </footer>

    </main>

    <script>
        (function () {
            'use strict';

            const $ = (sel) => document.querySelector(sel);

            const form = $('#contactForm');
            const status = $('#formStatus');
            const submitBtn = $('#submitBtn');
            const closeBtn = $('#closeBtn');
            const yearEl = $('#year');

            if (yearEl) yearEl.textContent = String(new Date().getFullYear());

            const MIN_NAME = 2;
            const MIN_MSG = 10;

            let statusTimer = null;

            function showStatus(message, type) {
                if (statusTimer) clearTimeout(statusTimer);
                status.textContent = message;
                status.className = 'status is-visible is-' + type;
                if (type !== 'loading') {
                    statusTimer = setTimeout(function () {
                        status.className = 'status';
                    }, 5000);
                }
            }

            function validateForm(name, email, message) {
                if (!name || name.length < MIN_NAME) return 'Please enter your name (at least 2 characters).';
                if (name.length > 60) return 'Name is too long.';
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
                if (!email || !emailRegex.test(email)) return 'Please enter a valid email address.';
                if (!message || message.length < MIN_MSG) return 'Message must be at least 10 characters.';
                if (message.length > 2000) return 'Message is too long.';
                return null;
            }

            function resetBtn() {
                submitBtn.disabled = false;
                submitBtn.innerHTML =
                    '<span>Send Message</span>' +
                    '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">' +
                    '<path d="M3 11L11 3M11 3H5M11 3V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
                    '</svg>';
            }

            if (form) {
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const honeypot = $('#hp_website');
                    if (honeypot && honeypot.value.trim() !== '') {
                        return;
                    }

                    const name = $('#user_name').value.trim();
                    const email = $('#user_email').value.trim();
                    const message = $('#user_message').value.trim();

                    const error = validateForm(name, email, message);
                    if (error) {
                        showStatus(error, 'error');
                        return;
                    }

                    showStatus('Sending your message…', 'loading');
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span>Sending…</span>';

                    // Context detection from URL query
                    const params = new URLSearchParams(window.location.search);
                    const context = params.get('from') || 'general';

                    try {
                        const res = await fetch('/api/contact', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: name,
                                email: email,
                                message: message,
                                website: '',
                                context: context
                            })
                        });

                        const data = await res.json().catch(function () { return {}; });

                        if (!res.ok) {
                            showStatus(data.error || 'Failed to send. Try again.', 'error');
                            resetBtn();
                            return;
                        }

                        showStatus("Message sent. I'll reply soon.", 'success');
                        form.reset();
                        resetBtn();
                    } catch (err) {
                        console.error(err);
                        showStatus('Network error. Try again.', 'error');
                        resetBtn();
                    }
                });
            }

            function goBack() {
                if (window.history.length > 1) {
                    window.history.back();
                    setTimeout(function () {
                        window.location.href = 'index.html';
                    }, 300);
                } else {
                    window.location.href = 'index.html';
                }
            }

            if (closeBtn) {
                closeBtn.addEventListener('click', goBack);
            }

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') {
                    goBack();
                }
            });

            console.log('✅ contact form ready (server-side)');
        })();
    </script>

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
    
</body>
</html>
